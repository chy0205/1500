<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>呈奏呈報表</title>
  <style>
    :root{
      --gold:#f2cf08;
      --red:#c90000;
      --deep-red:#a80000;
      --blue:#063dff;
      --ink:#111;
      --stage-w:1600px;
      --stage-h:900px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--gold);
      color:var(--ink);
      font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #stage{
      width:var(--stage-w);
      height:var(--stage-h);
      padding:28px 42px 20px;
      position:relative;
      transform-origin:center center;
      overflow:hidden;
      background:var(--gold);
    }

    .red{color:var(--red);font-weight:700}
    .blue{color:var(--blue);font-weight:700}

    .hero{
      height:176px;
      text-align:center;
    }

    .title{
      margin:0;
      color:var(--red);
      font-size:58px;
      line-height:1;
      letter-spacing:.88em;
      padding-left:.88em;
      font-weight:700;
    }

    .deity{
      margin-top:13px;
      font-size:27px;
      line-height:1.1;
    }

    .date-row{
      margin-top:14px;
      font-size:26px;
      line-height:1.2;
      white-space:nowrap;
      text-align:center;
    }

    .major-rule{
      position:relative;
      height:16px;
      border-top:3px solid var(--red);
      margin-top:10px;
    }

    .top-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:38px;
      height:326px;
    }

    .section{
      min-width:0;
    }

    .section-head{
      display:flex;
      align-items:center;
      gap:10px;
      height:42px;
      margin-bottom:7px;
    }

    .section-badge{
      flex:0 0 auto;
      min-width:174px;
      padding:5px 18px 6px;
      border-radius:15px;
      background:var(--deep-red);
      border:2px solid var(--red);
      box-shadow:inset 0 0 0 2px #ffd962;
      color:#fff6b6;
      font-size:24px;
      line-height:1.05;
      text-align:center;
      font-weight:700;
      letter-spacing:.06em;
    }

    .section-head::after{
      content:"";
      height:2px;
      background:var(--red);
      flex:1;
    }

    .class-info{
      padding-right:10px;
    }

    .class-table,
    .stats-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }

    .class-table{
      font-size:23px;
      line-height:1.30;
    }

    .class-table td{
      padding:4px 0;
      vertical-align:top;
    }

    .class-label{
      width:150px;
      white-space:nowrap;
      color:var(--ink);
    }

    .class-value{
      color:var(--blue);
      font-weight:700;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .stats{
      padding-left:28px;
      border-left:2px solid var(--red);
      position:relative;
    }

    .stats-table{
      font-size:24px;
      line-height:1.25;
    }

    .stats-table td{
      height:40px;
      padding:4px 3px;
      vertical-align:middle;
      white-space:nowrap;
    }

    .stats-label{width:150px}

    .num{
      color:var(--blue);
      font-weight:700;
      font-size:31px;
      display:inline-block;
      min-width:38px;
      text-align:center;
    }

    .courses{
      height:112px;
      margin-top:2px;
      overflow:hidden;
    }

    .courses .section-head{
      margin-bottom:1px;
    }

    .course-list{
      margin-left:205px;
      margin-top:-3px;
      display:grid;
      row-gap:1px;
    }

    .course-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 170px;
      gap:18px;
      align-items:baseline;
      font-size:23px;
      line-height:1.28;
      color:var(--blue);
      font-weight:700;
      max-width:930px;
    }

    .course-speaker{
      white-space:nowrap;
    }

    .notes{
      height:224px;
      overflow:hidden;
      position:relative;
      padding-bottom:42px;
    }

    .notes .section-head{
      margin-bottom:5px;
    }

    .leave-row{
      display:grid;
      grid-template-columns:92px 1fr;
      align-items:start;
      column-gap:8px;
      margin-bottom:4px;
    }

    .leave-label{
      font-size:21px;
      line-height:1.3;
      font-weight:700;
      white-space:nowrap;
    }

    .leave-grid{
      display:grid;
      grid-template-columns:repeat(10,minmax(0,1fr));
      gap:2px 9px;
      color:var(--blue);
      font-weight:700;
      font-size:17px;
      line-height:1.25;
      min-width:0;
    }

    .leave-item{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
    }

    .leave-empty{
      color:var(--ink);
      font-weight:400;
      font-size:19px;
    }

    .signature{
      position:absolute;
      right:6px;
      bottom:4px;
      font-size:24px;
      line-height:1;
      white-space:nowrap;
      text-align:right;
    }

    #source-status{
      position:absolute;
      left:12px;
      bottom:8px;
      font-family:Arial,"Noto Sans TC",sans-serif;
      font-size:13px;
      color:#333;
      background:rgba(255,255,255,.58);
      border:1px solid rgba(0,0,0,.16);
      border-radius:10px;
      padding:4px 9px;
      user-select:none;
      z-index:20;
    }

    #source-status.ok{ color:#075f1d; }
    #source-status.err{ color:#9a1111; }

    @media(max-aspect-ratio:16/9){
      /* scaling handled by JS */
    }
  </style>
</head>
<body>
  <main id="stage">
    <header class="hero">
      <h1 class="title">呈　奏</h1>
      <div class="deity">
        <span id="deity" class="red"></span>　<span>大慈大悲</span>
      </div>
      <div class="date-row">
        天運歲次 <span id="ganzhi" class="red"></span> 年　
        西元 <span id="year" class="red"></span> 年　
        <span id="month" class="red"></span> 月　
        <span id="day" class="red"></span> 日　
        為期 <span id="days" class="red"></span> 天
      </div>
      <div class="major-rule"></div>
    </header>

    <section class="top-grid">
      <div class="section class-info">
        <div class="section-head"><div class="section-badge">班務資訊</div></div>
        <table class="class-table">
          <tr><td class="class-label">班　　名：</td><td id="className" class="class-value"></td></tr>
          <tr><td class="class-label">主辦單位：</td><td id="organizer" class="class-value"></td></tr>
          <tr><td class="class-label">監　　班：</td><td id="supervisor" class="class-value"></td></tr>
          <tr><td class="class-label">主　　班：</td><td id="mainLeader" class="class-value"></td></tr>
          <tr><td class="class-label">領　　班：</td><td id="leaders" class="class-value"></td></tr>
        </table>
      </div>

      <div class="section stats">
        <div class="section-head"><div class="section-badge">人數統計</div></div>
        <table class="stats-table">
          <tr>
            <td class="stats-label">班　　員：</td>
            <td>乾 <span id="studentM" class="num"></span> 名</td>
            <td>坤 <span id="studentF" class="num"></span> 名</td>
            <td>計 <span id="studentT" class="num"></span> 名</td>
          </tr>
          <tr>
            <td class="stats-label">小 班 長：</td>
            <td>乾 <span id="leaderM" class="num"></span> 名</td>
            <td>坤 <span id="leaderF" class="num"></span> 名</td>
            <td>計 <span id="leaderT" class="num"></span> 名</td>
          </tr>
          <tr>
            <td class="stats-label">班內服務：</td>
            <td>乾 <span id="insideM" class="num"></span> 名</td>
            <td>坤 <span id="insideF" class="num"></span> 名</td>
            <td></td>
          </tr>
          <tr>
            <td class="stats-label">班外服務：</td>
            <td>乾 <span id="outsideM" class="num"></span> 名</td>
            <td>坤 <span id="outsideF" class="num"></span> 名</td>
            <td></td>
          </tr>
          <tr>
            <td class="stats-label">合　　計：</td>
            <td>乾 <span id="totalM" class="num"></span> 名</td>
            <td>坤 <span id="totalF" class="num"></span> 名</td>
            <td></td>
          </tr>
          <tr>
            <td class="stats-label">共　　計：</td>
            <td colspan="3">乾坤 <span id="grandTotal" class="num"></span> 名</td>
          </tr>
        </table>
      </div>
    </section>

    <section class="section courses">
      <div class="section-head"><div class="section-badge">今日人事課程</div></div>
      <div id="courseList" class="course-list"></div>
    </section>

    <section class="section notes">
      <div class="section-head"><div class="section-badge">備註（請假名單）</div></div>

      <div class="leave-row">
        <div class="leave-label">病　假：</div>
        <div id="sickList" class="leave-grid"></div>
      </div>

      <div class="leave-row">
        <div class="leave-label">事　假：</div>
        <div id="personalList" class="leave-grid"></div>
      </div>

      <div class="signature">
        弟子　<span id="signer" class="blue"></span>　叩呈
      </div>
    </section>

    <div id="source-status"></div>
  </main>
